[package]
name = "aos-data"
version = "0.1.0"
edition = "2021"
description = "Portable ao0 vault toolkit: CLI + TUI for notes/kh Obsidian ledgers"
license = "MIT"
publish = false

[[bin]]
name = "aos-data"
path = "src/main.rs"

[lib]
name = "aos_data"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
strip = true
lto = true
opt-level = "z"
