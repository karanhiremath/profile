unbind C-b
set -g prefix C-a
bind C-a send-prefix

if-shell "command -v zsh >/dev/null 2>&1" "set -g default-shell $(command -v zsh); set -g default-command 'exec zsh'" "set -g default-shell $(command -v bash); set -g default-command 'exec bash'"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"
set -g focus-events on

set -g history-limit 100000
set -g renumber-windows on
set -g status-bg colour4
set -g status-fg colour15
set -g status-right '#{prefix_highlight} #(~/src/profile/bin/sys/mem --statusline) %a %Y-%m-%d %H:%M:%S | %s '
set -g status-right-length 160
set -g status-left-length 32
set -g status-interval 1

# tmux 3.2a (Ubuntu 22.04 apt) does not support extended-keys-format.
# Use -q so one unsupported option does not abort the entire config on hosts.
set -gq extended-keys on
set -gq extended-keys-format csi-u

bind-key m set-option -g mouse on \; display 'Mouse: ON'
bind-key M set-option -g mouse off \; display 'Mouse: OFF'

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "~/"
bind C new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Use vim bindings
setw -g mode-keys vi

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# switch panes using Alt-vim bindings without prefix
unbind-key h
unbind-key l
unbind-key k
unbind-key j
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key E split-window -h "vim ~/profile/.tmux.conf"
bind-key S-Left swap-window -t -1
bind-key S-right swap-window -t +1

# Break current pane into a new named session
bind B command-prompt -p "Break pane to session:" "run-shell '~/src/profile/bin/tmux/tmux-breakout \"%%\"'"

# System inspection popups (requires tmux >= 3.2)
#   <prefix> ~  -> btop (full process/CPU/mem/disk/net)
#   <prefix> $  -> mem  (custom dashboard with paused-agent counts)
#   <prefix> %  -> sys-popup picker (btop|mem|htop|top)
bind '~' display-popup -E -w 92% -h 90% -T ' btop ' '~/src/profile/bin/tmux/sys-popup btop'
bind '$' display-popup -E -w 80% -h 70% -T ' mem '  '~/src/profile/bin/tmux/sys-popup mem'
bind '%' display-popup -E -w 60% -h 30% -T ' sys '  "read -p 'tool [btop/mem/htop/top]: ' t && ~/src/profile/bin/tmux/sys-popup \$t"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/vim-tmux'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Disabled 2026-06-06: tmux-continuum injects a status-right #() hook that wedged
# large tmux servers by spawning overlapping autosaves. Use manual resurrect saves.
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes 'ssh "~vagrant ssh"'
set -g @continuum-boot 'off'
set -g @continuum-boot-options 'iterm'

set-option -g renumber-windows on

run -b '~/.tmux/plugins/tpm/tpm'
