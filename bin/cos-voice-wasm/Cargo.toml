[package]
name = "cos-voice-wasm"
version = "0.1.0"
edition = "2021"
description = "Deterministic Cos-voice apply host: dest routes, chip feed, supervisor stub"
authors = ["Karan Hiremath"]
license = "MIT"
rust-version = "1.80"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cos-voice-apply"
path = "src/bin/cos-voice-apply.rs"

[[bin]]
name = "cos-voice-host"
path = "src/bin/cos-voice-host.rs"

[[bin]]
name = "cos-voice-wasi"
path = "src/bin/cos-voice-wasi.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[dev-dependencies]
serde_json = "1"
