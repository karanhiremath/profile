receivers:
  prometheus/fleet:
    config:
      scrape_configs:
        - job_name: hermes-fleet
          scrape_interval: 5s
          static_configs:
            - targets: [host.containers.internal:9470]
  filelog/manager:
    include: [/var/log/hermes-manager/events.jsonl]
    start_at: beginning
    operators:
      - type: json_parser

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: service.name
        value: hermes-sandbox-manager
        action: upsert
      - key: service.namespace
        value: agentic
        action: upsert
      - key: deployment.environment
        value: local-dev
        action: upsert
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [prometheus/fleet]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [filelog/manager]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
