apiVersion: 1

datasources:
  - name: Hermes Fleet Metrics
    uid: hermes-fleet-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Hermes Fleet Logs
    uid: hermes-fleet-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
