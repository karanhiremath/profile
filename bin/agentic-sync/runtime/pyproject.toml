[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-inspect"
version = "0.1.0"
description = "Read-only repository context and dry-run notes sync planning"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentic-sync-notes = "agentic_inspect.cli:notes_main"
repo-context = "agentic_inspect.cli:oracle_main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
