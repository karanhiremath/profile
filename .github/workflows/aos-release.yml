name: aos-release

on:
  push:
    tags:
      - "aos-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (aos-v0.1.0). Empty uses the pushed tag or a dry build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: aos-darwin-arm64
          - os: ubuntu-24.04
            asset: aos-linux-x64
          - os: ubuntu-24.04-arm
            asset: aos-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          AOS_RELEASE: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cargo build --release --manifest-path bin/aos-buf/Cargo.toml --bin aos
          mkdir -p dist
          cp bin/aos-buf/target/release/aos "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum aos-* | tee SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          notes="Portable aos binary. Verify SHA256SUMS.txt. Never curl|sh. Install: bin/aos-buf/install --tag $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/aos-* dist/SHA256SUMS.txt --title "$TAG" --notes "$notes" --verify-tag \
              || gh release upload "$TAG" dist/aos-* dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/aos-* dist/SHA256SUMS.txt --title "$TAG" --notes "$notes" --target "$GITHUB_SHA" \
              || gh release upload "$TAG" dist/aos-* dist/SHA256SUMS.txt --clobber
          fi
