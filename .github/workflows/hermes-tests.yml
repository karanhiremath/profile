name: hermes-tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  hermes-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test deps (pyyaml only; everything else is stdlib)
        run: python -m pip install --quiet pyyaml

      - name: Run hermes tooling test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v