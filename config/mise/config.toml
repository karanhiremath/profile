# mise tool declarations for the profile dev environment.
# Symlinked to ~/.config/mise/config.toml by bin/mise/install.
# `mise install` provisions everything below; shell activation
# (eval "$(mise activate <shell>)") puts the shims on PATH.
[tools]
node = "lts"
pnpm = "latest"
neovim = "latest"
uv = "latest"
# omp/oh-my-pi: do not pin github:can1357/oh-my-pi here yet.
# mise ls-remote currently tops out at 18.0.11; the playable pin is
# GitHub release v18.1.2 via bin/omp/install (checksummed). Adding a
# stale mise pin would downgrade the host binary.
