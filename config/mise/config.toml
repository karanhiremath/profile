# mise tool declarations for the profile dev environment.
# Symlinked to ~/.config/mise/config.toml by bin/mise/install.
# `mise install` provisions everything below; shell activation
# (eval "$(mise activate <shell>)") puts the shims on PATH.
[tools]
node = "lts"
pnpm = "latest"
neovim = "latest"
uv = "latest"
# `inf` and `sbx` parse TOML with the stdlib tomllib, which needs 3.11+. Pin a
# version rather than "latest" so a harness config that validates on one machine
# validates on the other.
python = "3.12"
