# Copy/link as a project's mise.toml on the work MacBook.
#   ln -fns ~/src/profile/config/mise/hosts/work-mbp.toml mise.toml
#   mise install && mise run validate

min_version = "2024.1.0"

[tools]
node = "lts"
pnpm = "latest"
uv = "latest"

[env]
HERMES_MACHINE_PROFILE = "work-mbp"
HERMES_HARNESS_HOST_CLASS = "work-mbp"
HARNESS_LIVE_SEAT = "cursor/grok-4.6:fast"
HARNESS_COT_SEAT = "openai-codex/gpt-5.5"
PROFILE_DIR = "~/src/profile"

[tasks.validate]
description = "Unit + pin/fork validate (no live LLM)"
run = "bin/hermes/harness validate --skip-sandbox"
dir = "{{env.PROFILE_DIR}}"

[tasks.eval]
description = "Live grok-4.6:fast smoke in cosw sandbox"
run = "bin/hermes/harness eval --seat cursor/grok-4.6:fast --sandbox"
dir = "{{env.PROFILE_DIR}}"

[tasks.eval-cot]
description = "gpt-5.5 CoT failure-mode probe (only when debugging that path)"
run = "bin/hermes/harness eval --failure-mode cot --sandbox"
dir = "{{env.PROFILE_DIR}}"

[tasks.nightly]
description = "ff-pull origin/main + stale stamp (does not promote)"
run = "bin/hermes/harness nightly"
dir = "{{env.PROFILE_DIR}}"
