port = 8080
path = "/v1"
health_path = "/v1/models"
[backends.dflash2-qwen-omlx.auth]
api_key_default = "none"
[backends.dflash2-qwen-omlx.model]
served_name = "qwen3.8-27b-4bit"
target = "mlx-community/Qwen3.8-27B-4bit"
draft = "incoai/Qwen3.8-27B-DFlash2"
quantization = "4bit"
[backends.dflash2-qwen-omlx.speculative_config]
algorithm = "dflash"
