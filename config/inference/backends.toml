  "--port", "{endpoint.port}",
  "--ctx-size", "16384",
  "--alias", "{model.served_name}",
]


[backends.dflash2-qwen-vllm]
description = "Qwen3.8-27B + DFlash2 on the vLLM DFlash PR branch (#52816), GPU. Sized for one 24GB card (GCP L4) — see the capacity note in SCHEMA.md."
kind = "local"
runtime = "vllm"
api = "openai-chat"
cost_class = "free"
data_boundary = "public"
speculative = true
[backends.dflash2-qwen-vllm.endpoint]
scheme = "http"
host = "127.0.0.1"
host_env = "INF_DFLASH2_VLLM_HOST"
port = 8000
path = "/v1"
health_path = "/health"
[backends.dflash2-qwen-vllm.auth]
api_key_env = "INF_DFLASH2_VLLM_API_KEY"
api_key_default = "none"
[backends.dflash2-qwen-vllm.model]
served_name = "qwen3.8-27b-dflash2"
target = "Qwen/Qwen3.8-27B"
draft = "incoai/Qwen3.8-27B-DFlash2"
# Qwen3.8-27B at bf16 is ~54GB of weights and will NOT fit a 24GB L4. 4-bit AWQ
# lands near 15GB and leaves room for the drafter plus KV cache. Drop this to ""
# (and raise gpu memory) on an 80GB card where bf16 fits.
quantization = "awq"
[backends.dflash2-qwen-vllm.speculative_config]
algorithm = "dflash"
num_speculative_tokens = 7
tensor_parallel_size = 1
baseline_backend = "vllm-local"
[backends.dflash2-qwen-vllm.capabilities]
streaming = true
tools = true
reasoning_effort = false
developer_role = false
[backends.dflash2-qwen-vllm.sandbox]
engine = "auto"
image = "localhost/inference/vllm-dflash2:dev"
build_context = "{profile_dir}/config/inference/runtimes/vllm-dflash2"
gpus = "all"
memory = "48g"
shm_size = "8g"
ports = ["{endpoint.port}:8000"]
volumes = ["{cache_dir}/hf:/root/.cache/huggingface"]
env = { HF_TOKEN = "@HF_TOKEN" }
# vLLM takes ONE JSON blob for the whole speculative config, not flag-per-field.
args = [
  "serve", "{model.target}",
  "--served-model-name", "{model.served_name}",
  "--quantization", "{model.quantization}",
  "--speculative-config", '{"method": "dflash", "model": "incoai/Qwen3.8-27B-DFlash2", "num_speculative_tokens": 7}',
  "--tensor-parallel-size", "1",
  "--max-model-len", "8192",
  "--gpu-memory-utilization", "0.92",
  "--host", "0.0.0.0",
  "--port", "8000",
]
[backends.dflash2-qwen-vllm.bindings.pi]
provider = "dflash2-vllm"
model_id = "qwen3.8-27b-dflash2"
[backends.dflash2-qwen-vllm.bindings.hermes]
provider = "openai-compat"
model = "qwen3.8-27b-dflash2"


[backends.dflash2-glimmer-sglang]
description = "Muse-Glimmer-30B + DFlash2 on SGLang. The reference configuration from the upstream post; multi-GPU."
kind = "local"
runtime = "sglang"
api = "openai-chat"
cost_class = "free"
data_boundary = "public"
speculative = true
[backends.dflash2-glimmer-sglang.endpoint]
scheme = "http"
host = "127.0.0.1"
host_env = "INF_SGLANG_HOST"
port = 30000
path = "/v1"
health_path = "/health"
[backends.dflash2-glimmer-sglang.auth]
api_key_default = "none"
[backends.dflash2-glimmer-sglang.model]
served_name = "muse-glimmer-30b-dflash2"
target = "incoai/Muse-Glimmer-30B"
draft = "incoai/Muse-Glimmer-30B-DFlash2"
[backends.dflash2-glimmer-sglang.speculative_config]
algorithm = "DFLASH"
# 8 upstream for SGLang, unlike vLLM/llama.cpp's 7.
num_speculative_tokens = 8
tensor_parallel_size = 2
[backends.dflash2-glimmer-sglang.capabilities]
streaming = true
tools = true
reasoning_effort = false
developer_role = false
[backends.dflash2-glimmer-sglang.sandbox]
engine = "auto"
image = "localhost/inference/sglang-dflash2:dev"
build_context = "{profile_dir}/config/inference/runtimes/sglang-dflash2"
gpus = "all"
memory = "96g"
shm_size = "16g"
ports = ["{endpoint.port}:30000"]
volumes = ["{cache_dir}/hf:/root/.cache/huggingface"]
env = { HF_TOKEN = "@HF_TOKEN" }
args = [
  "--model-path", "{model.target}",
  "--speculative-algorithm", "DFLASH",
  "--speculative-draft-model-path", "{model.draft}",
  "--speculative-num-draft-tokens", "8",
  "--served-model-name", "{model.served_name}",
  "--tp", "2",
  "--host", "0.0.0.0",
  "--port", "30000",
]
[backends.dflash2-glimmer-sglang.bindings.pi]
provider = "dflash2-sglang"
model_id = "muse-glimmer-30b-dflash2"


[backends.dflash2-qwen-ollama]
description = "Qwen3.8-27B + DFlash2 via the Ollama dflash2 branch with an int4-quantized drafter. Host build, not containerized — Ollama owns its own daemon."
kind = "local"
runtime = "ollama"
api = "openai-chat"
cost_class = "free"
data_boundary = "public"
speculative = true
[backends.dflash2-qwen-ollama.endpoint]
scheme = "http"
host = "127.0.0.1"
host_env = "INF_OLLAMA_HOST"
port = 11434
path = "/v1"
health_path = "/api/tags"
[backends.dflash2-qwen-ollama.auth]
api_key_default = "ollama"
[backends.dflash2-qwen-ollama.model]
served_name = "qwen38-dflash2"
target = "Qwen/Qwen3.8-27B"
draft = "incoai/Qwen3.8-27B-DFlash2"
quantization = "int4"
[backends.dflash2-qwen-ollama.speculative_config]
algorithm = "dflash"
num_speculative_tokens = 7
baseline_backend = "ollama-local"
[backends.dflash2-qwen-ollama.capabilities]
streaming = true
tools = true
reasoning_effort = false
developer_role = false
[backends.dflash2-qwen-ollama.manual]
# The dflash2 branch has to be built from source and the model registered once;
# `inf up` prints these steps rather than pretending to automate a source build
# of someone else's fork.
reason = "requires building the Ollama dflash2 branch from source"
steps = [
  "git clone https://github.com/ollama/ollama && cd ollama && git fetch origin dflash2 && git checkout dflash2",
  "cmake -B build . && cmake --build build --parallel 8",
  "./ollama create qwen38-dflash2 --experimental --draft-quantize int4",
  "./ollama serve   # then: inf probe dflash2-qwen-ollama",
]
[backends.dflash2-qwen-ollama.bindings.pi]
provider = "dflash2-ollama"
model_id = "qwen38-dflash2"


[backends.dflash2-qwen-omlx]
description = "Qwen3.8-27B 4-bit + DFlash2 drafter on oMLX (release 0.6.2-dflash2). Native Apple-silicon path; the app is GUI-configured, so setup is manual by design."
kind = "local"
runtime = "omlx"
api = "openai-chat"
cost_class = "free"
data_boundary = "public"
speculative = true
platforms = ["darwin-arm64"]
