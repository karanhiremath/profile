[backends.dflash2-qwen-omlx.capabilities]
streaming = true
tools = true
reasoning_effort = false
developer_role = false
[backends.dflash2-qwen-omlx.manual]
reason = "oMLX ships as a prebuilt DMG configured through its GUI; there is no CLI to script"
steps = [
  "Download the oMLX 0.6.2-dflash2 release DMG and install it",
  "Model Downloader: fetch target mlx-community/Qwen3.8-27B-4bit",
  "Model Downloader: fetch drafter incoai/Qwen3.8-27B-DFlash2",
  "Model Manager: set runtime block size 5 and verify mode 'dflash'",
  "Start the oMLX server, then confirm the port with: inf probe dflash2-qwen-omlx",
]
[backends.dflash2-qwen-omlx.bindings.pi]
provider = "dflash2-mlx"
model_id = "qwen3.8-27b-4bit"


