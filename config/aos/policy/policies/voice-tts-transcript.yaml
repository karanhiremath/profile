schema: aos.policy.v1
id: voice-tts-transcript
priority: 90
enabled: true
mode: filter
description: >
  Voice/TTS transcripts never speak the exact stall sentence or a
  Chief-of-Staff timeout error. Silent rewrite to a continuation phrase.
  Exact sentence match only — "I'm working on the auth patch" stays.
  No local LLM. a-top / a-top vi supplies the spoken world brief.
surfaces:
  - stream.tts
  - stream.outbound
  - memory
rules:
  - id: rewrite-working-on-it
    surface:
      - stream.tts
      - stream.outbound
      - memory
    action: rewrite
    visibility: silent
    match:
      kind: sentence
      any:
        - I'm working on it
        - I am working on it
        - Working on it
        - I'm on it
    replace:
      - Still with the last confirmed fleet snapshot. Next I'll check the live panes.
      - Holding from the current a-top inventory while that turn finishes.
      - Continuing from the last confirmed state.
  - id: rewrite-cos-timeout
    surface:
      - stream.tts
      - stream.outbound
      - memory
    action: rewrite
    visibility: silent
    match:
      kind: sentence
      any:
        - Chief of Staff did not reply
        - The chief of staff did not reply
        - Chief of Staff didn't reply
        - Cos did not reply
        - CoS did not reply
    replace:
      - Still with the last confirmed fleet snapshot. Next I'll check the live panes.
      - Holding from the current a-top inventory while that turn finishes.
      - Continuing from the last confirmed state.
